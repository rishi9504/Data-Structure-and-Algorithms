services:
  recall:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    mem_limit: 96m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
